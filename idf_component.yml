name: "heaptop"
version: "0.5.0"
license: "MIT"
description: "Heaptop is an htop-like memory monitor for ESP-IDF over the serial console: what is used and free per heap region and per task, health checks (free memory, fragmentation, stack margins, leak suspects, failed allocations), a clear command for fresh measurement windows, CPU stress for benchmarks, and a JSON Lines stream."
url: "https://github.com/PedroLuisDionisioFraga/esp32s3_heaptop"
repository: "https://github.com/PedroLuisDionisioFraga/esp32s3_heaptop"
documentation: "https://github.com/PedroLuisDionisioFraga/esp32s3_heaptop/tree/main/README.md"
issues: "https://github.com/PedroLuisDionisioFraga/esp32s3_heaptop/issues"
# Only the chips CI builds for; esp32s3 (with PSRAM) is the primary target.
targets:
  - esp32
  - esp32s3
  - esp32c3
  - esp32c6
tags:
  - esp32
  - heap
  - memory
  - leak
  - fragmentation
  - freertos
  - monitor
  - console
examples:
  - path: examples/basic
files:
  exclude:
    - "test/**/*"
    # Local builds of the CI configs (build-minimal, build-c3, ...); build/ is excluded by default.
    - "examples/**/build-*/**/*"
    - ".devcontainer/**/*"
    - ".vscode/**/*"
    - ".claude/**/*"
    - ".superpowers/**/*"
dependencies:
  idf: ">=6.0.0"
